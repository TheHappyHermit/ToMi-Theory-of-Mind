# --------------------------------------------------------------------------
# CONFIDENCE DERIVATION - researched rubric, owner-ruled 2026-09-28.
# Full argument and citations: docs/CONFIDENCE-RUBRIC.md
# This YAML is now machine-generated from a dict; comments inside the
# derivation block are in that file, not here. Everything else below
# retains its original hand-written commentary.
# --------------------------------------------------------------------------

okf_version: '0.2'
schema_id: okf-canonical
schema_status: stable
updated: '2026-09-26'
required:
- okf_version
- id
- type
- status
- description
- generated
- tags
- sources
- confidence
