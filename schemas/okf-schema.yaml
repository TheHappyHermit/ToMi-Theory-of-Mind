- aliases
- review_after
- supersedes
- superseded_by
- provenance
- arxiv_id
- url
sources_shape:
  required_in_entry:
  - resource
  # `title` is REQUIRED for any source carrying a resolvable identifier
  # (DOI, arXiv id, or a peer-reviewed venue). It was optional until
  # 2026-09-30, and the T2 verifier needs a title to match the resolved
  # document against -- so an entry that satisfied the old schema exactly
  # was still recorded `untitled_citation` and could not be promoted.
  #
  # Measured before this change: 1,605 of 2,661 identifier-bearing source
  # entries corpus-wide had no title (60%), affecting 1,605 files. The
  # schema and the verifier disagreed, so every writer that followed the
  # schema faithfully produced a file that could not pass. A schema that
  # permits a shape the verifier rejects is a bug in the schema.
  #
  # Bare strings remain accepted for untiered pointers (a repo URL, a
  # session id) -- but NOT for a citable claim.
  conditional_required:
    title: 'required when the entry carries a DOI, arXiv id, or other
      resolvable identifier for a peer-reviewed or preprint source'
  optional_in_entry:
  - id
  - author
  - usage_count
  - last_modified
  sibling:
  - usage_window
  accepts_bare_string: true
  bare_string_maps_to:
    resource: <the string>
citation_placement:
  canonical_location: sources
  body_reference_list: legacy_v0_1
  in_body_marker_form: keyed_footnote
  positional_markers_allowed: false
  footnote_label_joins_to: sources[].id
  id_required_when: body_cites_the_source
  id_need_be_globally_canonical: false
  migration_target: 'Body bibliography entry -> sources[] item with a stable derived id

    (author-year-slug, e.g. howard-kahana-2002).

    In-body [[n]] or [n] -> [^that-id].

    Verify: every footnote label must join to a real sources[].id.

    '
