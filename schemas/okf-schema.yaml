  # ------------------------------------------------------------------------
  # CITATION SHAPE -- the single highest-value thing a writer can get right.
  #
  # Written 2026-09-30 after the confidence pass found 1,605 corpus source
  # entries with an identifier and no title. The verifier resolves an
  # identifier, fetches the real document, and compares the real title
  # against the title you wrote. With no title to compare, the file is
  # recorded `untitled_citation` and the page is capped at medium forever.
  #
  # So: ALWAYS write the title. It is not decoration; it is the evidence.
  # ------------------------------------------------------------------------
  citation_shape:
    rule: 'Every source entry carrying a DOI, arXiv id, or other resolvable
      identifier MUST carry the title exactly as the source states it.'
    good:
    - 'arXiv:2509.20021 (Embodied AI Survey)'
    - 'doi:10.1109/PROC.1975.9939 (The protection of information in computer systems)'
    - 'https://www.nature.com/articles/x (Attention Is All You Need)'
    - resource: doi:10.1038/s41534-025-01078-x
      title: Entanglement-induced provable and robust quantum learning advantages
      author: Wang et al.
    bad:
    - 'https://arxiv.org/abs/2607.18704'
    - 'arxiv:2607.18704'
    - 'see the paper'
    why_bad: 'The first two are USELESS to the verifier -- it can resolve them
      but has nothing to compare, so the file is capped at medium. The third
      is unresolvable and trips M1.'
    title_source: 'Take the title from the source itself -- the arXiv abstract
      page, the DOI landing page, the paper PDF. Do NOT paraphrase it and do
      NOT reconstruct it from memory. A remembered title that differs from
      the real one is M2_identifier_mismatch, which caps at low.'
    version_suffix: 'A trailing version (2607.01977v1) is stripped by the
      verifier, so writing it is harmless; omitting it is also fine.'
    never_fabricate: 'If you cannot retrieve the title, record the entry as
      unverified (status) rather than inventing a plausible one. A fabricated
      title is a fabrication signature, and the verifier will catch it.'
  provenance_is_not_authority: 'A populated `confidence` or `verified` field is a self-report,
    not evidence. It MUST NOT be used as an evidence weight. Only executed checks confer authority.

    '
  live_state: 'Point-in-time assertions (liveness, counts, sync cadence) MUST carry `observed_at`
    or live in a regenerated snapshot file, never in body prose.

    '
  deletion: archive or supersede; never silently delete
scope:
- /home/operator/.hermes/active-wiki
- /home/operator/.hermes/oracle/brain
excluded_dirs:
- graphify-out
- .git
- __pycache__
- _archive
- inbox
- node_modules
repair:
  auto:
  - add_missing_required
  - map_enum_value
  - normalise_okf_version
  - fix_datetime_format
  - fix_link_case
  - strip_index_suffix
  - dedupe_repeated_header
  - drop_link_to_nonexistent_ref_section
  report_only:
  - wrong_attribution
  - fabricated_claim
  - stale_live_state
  - source_truncation
  - unresolved_citation
  - missing_index
  - index_incomplete
  - body_prose_defect
  - case_collision_directory
