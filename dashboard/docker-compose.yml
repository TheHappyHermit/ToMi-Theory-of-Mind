services:
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    container_name: hermes-dashboard
    restart: unless-stopped
    ports:
      - '8088:8088'
    volumes:
      - ./data:/data
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HERMES_HOME=/data
      - HERMES_DATA_DIR=/data
      - CONFIG_PATH=/config/services.yaml
      - DOCKER_SOCKET=/var/run/docker.sock
      - DASHBOARD_PORT=8088

      - TZ=UTC
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8088/api/health']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
